services:
  psacc:
    image: flobz/psa_car_controller:latest
    container_name: psacc
    restart: unless-stopped
    tty: true
    stdin_open: true
    environment:
      # modifié automatiquement par rental-sync.sh en mode location (sans -r : rien n'est enregistré)
      PSACC_OPTIONS: ${PSACC_OPTIONS:--c -r --web-conf}
    volumes:
      - ${PSACC_CONFIG:-./psacc}:/config:z

  app:
    image: ${APP_IMAGE:-ghcr.io/aplaideau/corsa-app:latest}
    container_name: corsa-app
    restart: unless-stopped
    env_file: .env
    environment:
      PSACC_URL: http://psacc:5000
      PSACC_CONFIG_DIR: /psacc-config
      DATA_DIR: /data
    volumes:
      # lecture seule : l'appli vérifie seulement si l'OTP est configuré
      - ${PSACC_CONFIG:-./psacc}:/psacc-config:ro,z
      # état de l'appli (mode location), lu par rental-sync.sh
      - ./data:/data:z
    ports:
      - "8080:8080"
      # page publique « niveau de batterie » : seulement en local, publiée par Tailscale Funnel
      - "127.0.0.1:8081:8081"
    depends_on:
      - psacc
