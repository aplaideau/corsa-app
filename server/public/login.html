<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Ma Corsa-e – Connexion</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: system-ui, sans-serif; margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #f4f5f7; color: #222; padding: 20px; }
  form { background: #fff; border-radius: 16px; padding: 28px 22px; width: 100%; max-width: 360px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  h1 { font-size: 1.4rem; margin: 0 0 22px; text-align: center; }
  label { display: block; font-size: .9rem; color: #555; margin: 14px 0 6px; }
  input[type=text], input[type=password] { width: 100%; font-size: 1.1rem; padding: 12px; border: 2px solid #ddd; border-radius: 10px; }
  input:focus { outline: none; border-color: #1a73e8; }
  .remember { display: flex; align-items: center; gap: 10px; margin: 18px 0 22px; color: #444; }
  .remember input { width: 20px; height: 20px; }
  button { width: 100%; font-size: 1.1rem; padding: 14px; border: 0; border-radius: 12px; background: #1a73e8; color: #fff; cursor: pointer; }
  button:disabled { opacity: .6; }
  #err { color: #c62828; text-align: center; min-height: 1.3em; margin-top: 14px; }
</style>
</head>
<body>
<form id="f">
  <h1>Ma Corsa-e</h1>
  <label for="user">Identifiant</label>
  <input id="user" type="text" autocomplete="username" autocapitalize="none" required>
  <label for="pwd">Mot de passe</label>
  <input id="pwd" type="password" autocomplete="current-password" required>
  <div class="remember"><input id="rem" type="checkbox" checked><label for="rem" style="margin:0">Rester connecté</label></div>
  <button id="b" type="submit">Se connecter</button>
  <div id="err"></div>
</form>
<script>
  document.getElementById("f").addEventListener("submit", async (e) => {
    e.preventDefault();
    const b = document.getElementById("b"), err = document.getElementById("err");
    b.disabled = true; err.textContent = "";
    try {
      const r = await fetch("/api/login", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ user: user.value, password: pwd.value, remember: rem.checked })
      });
      const d = await r.json();
      if (r.ok) location.href = "/corsa";
      else err.textContent = d.error || "Connexion impossible";
    } catch (x) { err.textContent = "Serveur injoignable"; }
    b.disabled = false;
  });
</script>
</body>
</html>
